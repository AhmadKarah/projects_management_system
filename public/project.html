<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tasks — Taskflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">

  <nav>
    <div class="nav-left">
      <div class="logo">
        <div class="logo-icon">✦</div>
        <span class="logo-text">Taskflow</span>
      </div>
      <div class="divider"></div>
      <span id="projectName">Loading...</span>
    </div>
    <div class="nav-right">
      <button class="back-btn" onclick="back()">← Projects</button>
      <button class="logout" onclick="logout()">Sign out</button>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <div>
        <h1 class="page-title">Tasks</h1>
        <p class="page-count" id="empty"></p>
      </div>
      <button class="new-btn" onclick="openModal()">+ New Task</button>
    </div>

    <div id="tasks"></div>
  </main>

  <!-- Modal -->
  <div id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <span id="modalTitle">Create Task</span>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="field">
        <label>Title</label>
        <input type="text" id="taskTitle" placeholder="Task name..." />
      </div>
      <div class="row">
        <div class="field">
          <label>Status</label>
          <div class="select-wrap">
            <select id="taskStatus">
              <option value="pending">Pending</option>
              <option value="in-progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Priority</label>
          <div class="select-wrap">
            <select id="taskPriority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        <button class="save-btn" id="saveBtn" onclick="saveTask()">Create</button>
      </div>
    </div>
  </div>

  <script src="js/project.js"></script>
</body>
</html>
