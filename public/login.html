<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Taskflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="logo" style="margin-bottom: 2rem;">
      <div class="logo-icon lg">✦</div>
      <span class="logo-text lg">Taskflow</span>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue to your workspace.</p>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>

    <div id="error"></div>

    <button class="primary" onclick="login()">Sign In</button>

    <p class="footer-link">Don't have an account? <a href="register.html">Create one</a></p>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
